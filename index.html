<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TAKIM · Feed de eventos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app">

    <header class="topbar">
      <span class="topbar__brand">TAKIM</span>
      <button class="topbar__icon-btn" aria-label="Buscar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <main class="feed" id="feed">
      <!-- Las publicaciones se generan dinámicamente desde app.js -->
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <nav class="navbar" aria-label="Navegación principal">
      <button class="navbar__item is-active" data-nav="inicio">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 11.5L12 4l8 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Inicio</span>
      </button>
      <button class="navbar__item" data-nav="explorar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M15 9l-2 5-5 2 2-5 5-2z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>Explorar</span>
      </button>
      <button class="navbar__item navbar__item--create" data-nav="crear" aria-label="Crear evento">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M12 8v8M8 12h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="navbar__item" data-nav="notificaciones">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 10a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 14 6 10z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9.5 18a2.5 2.5 0 0 0 5 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Avisos</span>
      </button>
      <button class="navbar__item" data-nav="perfil">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.5" r="3.5" stroke="currentColor" stroke-width="2"/><path d="M4.5 20c1.4-3.5 4.4-5.5 7.5-5.5s6.1 2 7.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Perfil</span>
      </button>
    </nav>

  </div>

  <template id="post-template">
    <article class="post">
      <header class="post__header">
        <div class="post__author">
          <img class="post__avatar" alt="">
          <div>
            <p class="post__username"></p>
            <p class="post__meta"></p>
          </div>
        </div>
        <button class="follow-btn" type="button">Seguir</button>
      </header>

      <div class="post__media">
        <img class="post__image" alt="">
        <span class="chip"></span>
        <span class="points-badge"></span>
      </div>

      <div class="post__body">
        <h2 class="post__title"></h2>
        <p class="post__location"></p>

        <div class="attendees">
          <div class="attendees__avatars"></div>
          <span class="attendees__label"></span>
        </div>

        <div class="post__actions">
          <button class="action-btn like-btn" type="button">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" class="like-icon"><path d="M12 20s-7-4.4-9.5-9C.8 7.3 2.6 4 6 4c2 0 3.4 1.1 4.2 2.2.6.8 1 1.3 1.8 1.3s1.2-.5 1.8-1.3C14.6 5.1 16 4 18 4c3.4 0 5.2 3.3 3.5 7-2.5 4.6-9.5 9-9.5 9z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
            <span class="like-count"></span>
          </button>
          <button class="action-btn comment-toggle" type="button">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4V5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
            <span class="comment-count"></span>
          </button>
          <button class="attend-btn" type="button">Asistiré</button>
        </div>

        <p class="points-info"></p>

        <section class="comments">
          <ul class="comments__list"></ul>
          <form class="comments__form">
            <input type="text" class="comments__input" placeholder="Escribí un comentario..." maxlength="140">
            <button type="submit" class="comments__send" aria-label="Enviar comentario">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 11.5L20.5 3 12 20.5l-2.5-7L3 11.5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
            </button>
          </form>
        </section>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
